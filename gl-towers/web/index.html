const $=s=>document.querySelector(s);

const d={ph:[3.3,3.4,3.35,3.5,3.42,3.37,3.46,3.55,3.44,3.39,3.47,3.51],ec:[4,4.15,4.02,4.18,3.95,4.08,3.9,4.1,3.98,4.17,4.05,4.0],water:[4.8,4.9,4.84,4.88,4.75,4.68,4.55,4.6,4.66,4.7,4.78,4.9],air:[5.2,5.35,5.18,5.22,5.08,5.1,5.25,5.32,5.2,5.08,5.12,5.28],hum:[6.1,6.28,6.15,5.9,5.75,5.95,5.86,5.78,5.7,5.85,6.1,6.24],res:[65,67,62,59,55,58,52,49,45,47,51,48,44,50,58,61]};

function spark(a,c=green){let w=180,h=42,p=4,mi=Math.min(...a),ma=Math.max(...a),r=ma-mi||1,pts=a.map((v,i)=>`${p+i*(w-p*2)/(a.length-1)},${h-p-(v-mi)/r*(h-p*2)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2"/></svg>`}

function chart(series,opts={}){let w=760,h=250,p={l:44,r:52,t:18,b:34},flat=series.flatMap(s=>s.v),mi=opts.min??Math.min(...flat),ma=opts.max??Math.max(...flat),r=ma-mi||1,x=i=>p.l+i*(w-p.l-p.r)/(series[0].v.length-1),y=v=>h-p.b-(v-mi)/r*(h-p.t-p.b),grid=[0,.25,.5,.75,1].map(t=>`<line x1="${p.l}" x2="${w-p.r}" y1="${p.t+t*(h-p.t-p.b)}" y2="${p.t+t*(h-p.t-p.b)}" stroke="#e8eeea" stroke-dasharray="2 3"/>`).join(''),yl=(opts.yl||['7.0','6.0','5.0','4.0','3.0']).map((l,i)=>`<text x="32" y="${p.t+i*(h-p.t-p.b)/4+4}" fill="${green}" font-size="12" text-anchor="end">${l}</text>`).join(''),xl=['13:00','18:00','23:00','04:00','09:00','13:00'].map((t,i)=>`<text x="${p.l+i*(w-p.l-p.r)/5}" y="${h-8}" text-anchor="middle" fill="#4b5750" font-size="12">${t}</text>`).join(''),paths=series.map(s=>`<path d="${s.v.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" ${s.d?'stroke-dasharray="5 5"':''}/>${s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2" fill="${s.c}"/>`).join('')}`).join('');return `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<line x1="${p.l}" x2="${w-p.r}" y1="${h-p.b}" y2="${h-p.b}" stroke="#dfe7e2"/>${yl}${xl}${paths}</svg>`}
function trend(title='Sensor Trends (24h)'){return `<div class="card card-pad"><div class="section-title"><h2>${title}</h2><button class="select">24 Hours⌄</button></div><div class="legend"><span><i style="background:${green}"></i>pH</span><span><i style="background:${purple}"></i>EC</span><span><i style="background:${blue}"></i>Water Temp</span><span><i style="background:${orange}"></i>Air Temp</span><span><i style="background:${purple}"></i>Humidity</span></div><div class="chart-wrap">${chart([{c:green,v:d.ph},{c:purple,v:d.ec},{c:blue,v:d.water},{c:orange,v:d.air},{c:purple,v:d.hum,d:1}],{min:3,max:7})}</div><button class="btn full ghost">View all sensor insights →</button></div>`}

,'◉'],['Export Data','⇩'],['System Check','🛡'],['Add Note','▤']],'Create Report')}</div>`}

function plantCategories(){const m={};APP_PLANTS.forEach(p=>m[p.categoryGL]=(m[p.categoryGL]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function appPlantById(id){return APP_PLANTS.find(p=>p.id===id)||APP_PLANTS[0];}
function plantRows(limit){const list=limit?APP_PLANTS.slice(0,limit):APP_PLANTS;return list.map(p=>`<tr data-plant-row data-name="${(p.displayName||'').toLowerCase()}" data-cat="${p.categoryGL}"><td><span style="font-size:24px;margin-right:8px">${p.emoji||'🌱'}</span><b>${p.displayName}</b><br><span class="muted">${p.nameIT||p.nameEN||''}</span></td><td><span class="pill ${p.categoryGL==='Herbs'?'purple':p.categoryGL==='Fruiting'?'orange':p.categoryGL==='Microgreens'?'blue':''}">${p.categoryGL}</span></td><td>${p.daysToHarvest||'—'}</td><td>${p.phMin}–${p.phMax}</td><td>${p.ecMin}–${p.ecMax}</td><td>${p.waterTempRangeC} °C</td><td>${p.photoperiodMinH}–${p.photoperiodMaxH} h</td><td><b>${p.cwbeCompatibilityScore||'—'}</b><br><span class="muted">${p.cwbeCompatibilityLevel||''}</span></td><td>${p.difficulty||'—'}</td></tr>`).join('');}
function plantLibraryTable(){return `<div class="card card-pad table-card mt"><div class="section-title"><div><h2>Full App Plant Library</h2><span class="muted">Imported from the GL Towers app: ${APP_PLANTS.length} crop profiles with pH, EC, temperature, lighting, irrigation and CWBE compatibility.</span></div><div class="search-row"><input class="search plant-search" placeholder="Search all ${APP_PLANTS.length} plants..."><button class="select">All categories⌄</button></div></div><div class="tabs">${plantCategories().map(([c,n])=>`<button class="chip plant-cat" data-cat="${c}">${c} <span class="muted">${n}</span></button>`).join('')}</div><table class="table"><thead><tr><th>Plant</th><th>Category</th><th>Harvest</th><th>pH</th><th>EC</th><th>Water Temp</th><th>Light</th><th>CWBE</th><th>Difficulty</th></tr></thead><tbody>${plantRows()}</tbody></table></div>`;}
function selectedPlantPanel(id='basil'){const p=appPlantById(id);return `<div class="section-title"><div><h2>Selected App Plant</h2><h1 style="margin:4px 0">${p.emoji} ${p.displayName}</h1><span class="muted"><i>${p.nameIT}</i></span><br><span class="pill mt">${p.categoryGL}</span></div><div class="plant-photo">${p.emoji}</div></div><h2 class="card-title">Grow Recipe From App</h2><div class="params"><div>Grow cycle<br><b>${p.daysToHarvest}</b></div><div>Difficulty<br><b>${p.difficulty}</b></div><div>CWBE score<br><b>${p.cwbeCompatibilityScore} / 100</b><br><span class="ok">${p.cwbeCompatibilityLevel}</span></div><div>Water demand<br><b>${p.dailyWaterVegetativeMlPlant} mL / plant</b></div></div><h2 class="card-title mt">Recommended Parameters</h2><div class="params"><div>pH<br><b>${p.phMin} – ${p.phMax}</b><br><span class="ok">Optimal</span></div><div>EC<br><b>${p.ecMin} – ${p.ecMax}</b><br><span class="ok">Optimal</span></div><div>Water Temp<br><b>${p.waterTempRangeC} °C</b><br><span class="ok">Optimal</span></div><div>Air Temp<br><b>${p.towerTempRangeC} °C</b><br><span class="ok">Optimal</span></div><div>Photoperiod<br><b>${p.photoperiodMinH} – ${p.photoperiodMaxH} h</b><br><span class="ok">Optimal</span></div><div>PPFD stages<br><b>${p.ppfdStage1}</b><br><span class="muted">${p.ppfdStage2} / ${p.ppfdStage3}</span></div></div><p class="detail-note">${p.description||'Plant profile imported from the GL Towers app.'}</p><button class="btn full ghost mt">View crop guide →</button>`;}

function pagePlants(){
  const cats=plantCategories();
  const top=APP_PLANTS.slice(0,8);
  return `<div class="grid metrics-4 mb">${metric('App Plant Library',String(APP_PLANTS.length),'Imported crop profiles from the GL Towers app','☘',green,d.ph)}${metric('Plant Categories',String(cats.length),cats.map(c=>c[0]).slice(0,3).join(', ')+' + more','▦',green,d.ec)}${metric('Tower Optimized',String(APP_PLANTS.filter(p=>+p.cwbeCompatibilityScore>=80).length),'High CWBE compatibility profiles','✓',green,d.ph,88)}${metric('Active Tower Crops','9','Assigned to Tower 01 modules','⌘',green,d.ph,75)}</div><div class="segmented mb"><span class="active">Whole Tower</span><span>Per Module</span></div><div class="grid cols-3" style="grid-template-columns:.9fr 1.25fr 1.05fr"><div class="card card-pad"><div class="section-title"><h2>App Crop Library</h2><button class="btn ghost">+ Add crop</button></div><div class="search-row mb"><input class="search plant-search" placeholder="Search plants..."><button class="select">All types⌄</button></div><b class="muted">First plants from the app</b>${top.map(c=>`<div class="crop-row"><div class="crop-img">${c.emoji}</div><div><b>${c.displayName}</b><br><span class="muted">${c.nameIT||c.nameEN} · ${c.daysToHarvest} days</span></div><span><span class="pill ${c.categoryGL==='Herbs'?'purple':c.categoryGL==='Fruiting'?'orange':''}">${c.categoryGL}</span> ›</span></div>`).join('')}<button class="btn full ghost mt">View full app library below →</button></div><div class="card card-pad"><div class="section-title"><h2>Module Configuration</h2><button class="select">Tower 01⌄</button></div>${[['Top Module','basil,lettuce,kale'],['Middle Module','parsley,mint,spinach'],['Bottom Module','strawberry,coriander,radish-microgreens']].map((m,i)=>`<div class="module-card"><div>${tower('mini-tower')}</div><div><div class="kpi-line"><span><span class="module-index">${i+1}</span> <b>${m[0]}</b><br><span class="muted" style="margin-left:34px">App plant profiles assigned</span></span><b>3 / 3 positions ›</b></div><span class="muted">Crops</span><div class="crop-tags">${m[1].split(',').map(id=>{let p=appPlantById(id);return `<span class="tag">${p.emoji} ${p.displayName} ×</span>`}).join('')}</div></div><div><span class="muted">Avg days</span><br><b style="font-size:22px">${Math.round(m[1].split(',').reduce((a,id)=>a+(parseInt(appPlantById(id).daysToHarvest)||30),0)/3)}</b></div></div>`).join('')}<button class="btn full ghost">+ Add another app plant to tower</button></div><div class="card card-pad">${selectedPlantPanel('basil')}</div></div>${plantLibraryTable()}`
}

;align-items:center"><div><div class="big-num">2.3 <small>days</small></div><span class="pill">Until refill</span><p>Estimated date: Sep 15, 2026</p></div><div class="circle-gauge"><div class="inside"><b style="font-size:28px">42%</b><br>Reservoir<br>remaining</div></div></div></div><div class="card card-pad"><h2 class="card-title">Export & Reports</h2>${['Export Data (CSV)|Download raw sensor & event data','System Report (PDF)|Summary of system health & trends','Schedule Reports|Automate recurring system reports'].map(x=>{let p=x.split('|');return `<div class="list-card-row"><div class="small-icon">${ico('⇩')}</div><div><b>${p[0]}</b><br><span class="muted">${p[1]}</span></div><span>›</span></div>`}).join('')}</div></div></div><div class="grid cols-2"><div class="card card-pad"><h2 class="card-title">Parameter Trends (24h)</h2>${[['pH','6.3','Optimal',green],['EC','1.6','Optimal',purple],['Water Temp','22.5 °C','Optimal',blue],['Humidity','70 %','Good',purple],['Air Temp','23.1 °C','Good',orange],['Stability','95 /100','Excellent',green]].map(r=>`<div class="list-card-row"><span style="color:${r[3]}">●</span><span>${r[0]} ${spark(d.ph,r[3])}</span><b>${r[1]}</b><span class="pill">${r[2]}</span></div>`).join('')}<button class="btn full ghost mt">View all parameter insights →</button></div><div class="card card-pad"><div class="section-title"><h2>Advanced Analytics <span class="pill purple">Beta</span></h2><button class="btn ghost">Go advanced</button></div>${['ΔW / DAY (Estimated)|1000 mL|Water usage delta','Usage Efficiency|1.42 L / kWh|Energy efficiency'].map(x=>{let p=x.split('|');return `<div class="insight-mini mb"><b>${p[0]}</b><div class="num">${p[1]}</div><span class="muted">${p[2]}</span>${spark(d.water)}</div>`}).join('')}<button class="btn full ghost mt">Explore advanced analytics →</button></div></div>`}

function openDetail(label){
  const safe=(label||'GL Towers Option').replace(/\s+/g,' ').trim()||'GL Towers Option';
  const old=document.querySelector('.modal-backdrop'); if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${safe}</h2><button class="modal-close" aria-label="Close">×</button></div><div class="modal-body">${detailContent(safe)}<div class="right mt"><button class="btn ghost modal-close">Cancel</button> <button class="btn green save-demo">Save changes</button></div></div></div></div>`);
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.addEventListener('click',e=>{
  if(e.target.closest('.modal-close')||e.target.classList.contains('modal-backdrop')){document.querySelector('.modal-backdrop')?.remove();return;}
  if(e.target.closest('.save-demo')){document.querySelector('.modal-backdrop')?.remove();toast('Demo changes saved');return;}
  const navLink=e.target.closest('.nav a'); if(navLink) return;
  const el=e.target.closest('.action,.btn,.chip,.select,.settings-menu a,.icon-square,.crop-row,.list-card-row,.suggestion,.export-option');
  if(!el || el.closest('.modal,.tower-modal,.warehouse-modal')) return;
  // Buttons that carry a real action (data-* attribute) never open the demo detail pop-up
  if([...el.attributes].some(a=>a.name.startsWith('data-'))) return;
  if(el.matches('.settings-menu a')) e.preventDefault();
  if(el.tagName==='BUTTON'||el.matches('.action,.chip,.select,.settings-menu a,.icon-square,.crop-row,.list-card-row,.suggestion,.export-option')){
    const txt=el.innerText||el.textContent||'Option';
    openDetail(txt);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.modal-backdrop')?.remove();});
function filterPlantRows(query='',cat=''){
  query=(query||'').toLowerCase();
  document.querySelectorAll('[data-plant-row]').forEach(row=>{
    const okName=!query || row.dataset.name.includes(query);
    const okCat=!cat || row.dataset.cat===cat;
    row.style.display=(okName&&okCat)?'':'none';
  });
}
document.addEventListener('click',e=>{
  const catBtn=e.target.closest('.plant-cat');
  if(catBtn){
    e.preventDefault(); e.stopImmediatePropagation();
    const input=document.querySelector('.plant-search');
    document.querySelectorAll('.plant-cat').forEach(b=>b.classList.remove('active'));
    catBtn.classList.add('active');
    filterPlantRows(input?input.value:'',catBtn.dataset.cat);
  }
},true);
document.addEventListener('input',e=>{
  if(e.target.matches('.plant-search')){
    const active=document.querySelector('.plant-cat.active');
    filterPlantRows(e.target.value, active?active.dataset.cat:'');
  }
});

const GL_PLANT_STORE_KEY='gl_towers_dashboard_plants_v3';
const GL_TYPE_STORE_KEY='gl_towers_dashboard_plant_types_v3';
const TYPE_ICON_FALLBACK={Greens:'🥬',Herbs:'🌿',Microgreens:'🌱',Fruiting:'🍅',Flowers:'🌸','Roots & Bulbs':'🥕',Experimental:'🧪',Legumes:'🫘',Uncategorized:'🌱'};
let PLANT_MANAGER_FILTER={query:'',type:'All'};
function safeLSGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeLSSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function slugifyPlant(v){return String(v||'plant').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('plant-'+Date.now())}
function defaultPlants(){return APP_PLANTS.map(p=>({...p,emoji:p.emoji||TYPE_ICON_FALLBACK[p.categoryGL]||'🌱'}));}
function getPlants(){const raw=safeLSGet(GL_PLANT_STORE_KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}return defaultPlants();}
function savePlants(plants){safeLSSet(GL_PLANT_STORE_KEY,JSON.stringify(plants));}
function defaultTypes(){const map={};defaultPlants().forEach(p=>{const c=p.categoryGL||'Uncategorized';if(!map[c])map[c]={name:c,icon:TYPE_ICON_FALLBACK[c]||p.emoji||'🌱',description:`${c} crop profiles imported from the GL Towers app.`};});return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));}
function getTypes(){const raw=safeLSGet(GL_TYPE_STORE_KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}return defaultTypes();}
function saveTypes(types){safeLSSet(GL_TYPE_STORE_KEY,JSON.stringify(types));}
function plantTypeCounts(plants=getPlants()){const m={};plants.forEach(p=>m[p.categoryGL||'Uncategorized']=(m[p.categoryGL||'Uncategorized']||0)+1);return m;}
function typeOptions(selected=''){return getTypes().map(t=>`<option value="${esc(t.name)}" ${t.name===selected?'selected':''}>${esc(t.icon)} ${esc(t.name)}</option>`).join('')}
function plantTypeChips(plants=getPlants()){const counts=plantTypeCounts(plants);const types=getTypes();return `<button class="type-filter-chip active" data-filter-type="All">All <span class="muted">${plants.length}</span></button>${types.map(t=>`<button class="type-filter-chip" data-filter-type="${esc(t.name)}">${esc(t.icon)} ${esc(t.name)} <span class="muted">${counts[t.name]||0}</span></button>`).join('')}`}

function fillTypeForm(t){document.getElementById('typeOriginalName').value=t?.name||'';document.getElementById('typeIcon').value=t?.icon||'';document.getElementById('typeName').value=t?.name||'';document.getElementById('typeDescription').value=t?.description||'';}
function rerenderPlantsPage(){if((location.hash||'#dashboard').slice(1)==='plants')render();}
function pagePlants(){const plants=getPlants(), types=getTypes(), counts=plantTypeCounts(plants);const top=plants.slice(0,8);const towerOptimized=plants.filter(p=>+p.cwbeCompatibilityScore>=80).length;return `<div class="grid metrics-4 mb">${metric('Plant Profiles',String(plants.length),'Imported from the GL Towers app + your custom edits','☘',green,d.ph)}${metric('Plant Types',String(types.length),types.map(t=>t.name).slice(0,3).join(', ')+' + more','▦',green,d.ec)}${metric('Tower Optimized',String(towerOptimized),'High CWBE compatibility profiles','✓',green,d.ph,Math.min(100,Math.round(towerOptimized/plants.length*100)||0))}${metric('Active Tower Crops','9','Assigned to Tower 01 modules','⌘',green,d.ph,75)}</div><div class="segmented mb"><span class="active">Whole Tower</span><span>Per Module</span></div><div class="grid cols-3" style="grid-template-columns:.9fr 1.25fr 1.05fr"><div class="card card-pad"><div class="section-title"><h2>Imported App Icons</h2><button class="btn ghost" data-new-plant>+ Add plant</button></div><div class="notice-soft mb">All plant icons from the app are imported as editable emoji icons. Search any plant or type in the full manager below.</div><b class="muted">Sample imported plants</b>${top.map(c=>`<div class="crop-row"><div class="crop-img">${esc(c.emoji||'🌱')}</div><div><b>${esc(c.displayName)}</b><br><span class="muted">${esc(c.nameIT||c.nameEN)} · ${esc(c.daysToHarvest)} days</span></div><span><span class="pill ${c.categoryGL==='Herbs'?'purple':c.categoryGL==='Fruiting'?'orange':''}">${esc(c.categoryGL)}</span> ›</span></div>`).join('')}<button class="btn full ghost mt" onclick="document.getElementById('plantManagerSearch')?.focus()">Search full library ↓</button></div><div class="card card-pad"><div class="section-title"><h2>Module Configuration</h2><button class="select">Tower 01⌄</button></div>${[['Top Module','basil,lettuce,kale'],['Middle Module','parsley,mint,spinach'],['Bottom Module','strawberry,coriander,radish-microgreens']].map((m,i)=>`<div class="module-card"><div>${tower('mini-tower')}</div><div><div class="kpi-line"><span><span class="module-index">${i+1}</span> <b>${m[0]}</b><br><span class="muted" style="margin-left:34px">Profiles assigned from app library</span></span><b>3 / 3 positions ›</b></div><span class="muted">Crops</span><div class="crop-tags">${m[1].split(',').map(id=>{let p=plants.find(x=>x.id===id)||appPlantById(id);return `<span class="tag">${esc(p.emoji||'🌱')} ${esc(p.displayName)} ×</span>`}).join('')}</div></div><div><span class="muted">Avg days</span><br><b style="font-size:22px">${Math.round(m[1].split(',').reduce((a,id)=>{let p=plants.find(x=>x.id===id)||appPlantById(id);return a+(parseInt(p.daysToHarvest)||30)},0)/3)}</b></div></div>`).join('')}<button class="btn full ghost">+ Add another app plant to tower</button></div><div class="card card-pad">${selectedPlantPanel('basil')}</div></div><div class="plant-manager-grid">${typeManagerCard()}${plantEditorCard()}</div>${plantLibraryManager()}`}

document.addEventListener('input',e=>{if(e.target&&e.target.id==='plantManagerSearch'){PLANT_MANAGER_FILTER.query=e.target.value;applyEnhancedPlantFilter();}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='plantManagerType'){PLANT_MANAGER_FILTER.type=e.target.value;applyEnhancedPlantFilter();}});
document.addEventListener('click',e=>{
  const chip=e.target.closest('.type-filter-chip');if(chip){PLANT_MANAGER_FILTER.type=chip.dataset.filterType||'All';const sel=document.getElementById('plantManagerType');if(sel)sel.value=PLANT_MANAGER_FILTER.type;applyEnhancedPlantFilter();return;}
  if(e.target.closest('[data-clear-plant-filter]')){PLANT_MANAGER_FILTER={query:'',type:'All'};const s=document.getElementById('plantManagerSearch');const t=document.getElementById('plantManagerType');if(s)s.value='';if(t)t.value='All';applyEnhancedPlantFilter();return;}
  if(e.target.closest('[data-new-plant]')||e.target.closest('[data-clear-plant-form]')){fillPlantForm(null);document.getElementById('plantDisplayName')?.focus();return;}
  const edit=e.target.closest('[data-edit-plant]');if(edit){const p=getPlants().find(x=>x.id===edit.dataset.editPlant);if(p){fillPlantForm(p);document.getElementById('plantDisplayName')?.scrollIntoView({behavior:'smooth',block:'center'});}return;}
  const del=e.target.closest('[data-delete-plant]');if(del){const plants=getPlants();const p=plants.find(x=>x.id===del.dataset.deletePlant);if(p&&confirm(`Delete plant "${p.displayName}" from this dashboard?`)){savePlants(plants.filter(x=>x.id!==p.id));rerenderPlantsPage();}return;}
  if(e.target.closest('[data-save-plant]')){const p=collectPlantForm();if(!p)return;let plants=getPlants();const idx=plants.findIndex(x=>x.id===p.id);if(idx>=0)plants[idx]={...plants[idx],...p};else plants.unshift(p);savePlants(plants);PLANT_MANAGER_FILTER.query='';rerenderPlantsPage();return;}
  const editType=e.target.closest('[data-edit-type]');if(editType){const t=getTypes().find(x=>x.name===editType.dataset.editType);if(t)fillTypeForm(t);return;}
  if(e.target.closest('[data-clear-type-form]')){fillTypeForm(null);return;}
  if(e.target.closest('[data-save-type]')){const original=document.getElementById('typeOriginalName').value;const name=document.getElementById('typeName').value.trim();if(!name){alert('Please enter a type name.');return;}let types=getTypes();const next={name,icon:document.getElementById('typeIcon').value.trim()||TYPE_ICON_FALLBACK[name]||'🌱',description:document.getElementById('typeDescription').value.trim()||`${name} plant type.`};if(original){types=types.map(t=>t.name===original?next:t);if(original!==name){let plants=getPlants().map(p=>p.categoryGL===original?{...p,categoryGL:name}:p);savePlants(plants);}}else if(!types.some(t=>t.name.toLowerCase()===name.toLowerCase()))types.push(next);else{alert('This plant type already exists.');return;}saveTypes(types.sort((a,b)=>a.name.localeCompare(b.name)));rerenderPlantsPage();return;}
  const deleteType=e.target.closest('[data-delete-type]');if(deleteType){const name=deleteType.dataset.deleteType;if(name==='Uncategorized'){alert('Uncategorized cannot be deleted.');return;}const counts=plantTypeCounts();if(confirm(`Delete plant type "${name}"? ${counts[name]||0} plants will move to Uncategorized.`)){let types=getTypes().filter(t=>t.name!==name);if(!types.some(t=>t.name==='Uncategorized'))types.push({name:'Uncategorized',icon:'🌱',description:'Plants without an assigned type.'});saveTypes(types);savePlants(getPlants().map(p=>p.categoryGL===name?{...p,categoryGL:'Uncategorized'}:p));rerenderPlantsPage();}return;}
  if(e.target.closest('[data-reset-plant-library]')){if(confirm('Reset plant library, types, and all local edits back to the imported app data?')){try{localStorage.removeItem(GL_PLANT_STORE_KEY);localStorage.removeItem(GL_TYPE_STORE_KEY)}catch(e){}rerenderPlantsPage();}return;}
});

/* ─────────────────────────────────────────────────────────────
   Per-tower management and control center

────────────────────────────────────────────────────────────── */
const GL_TOWER_STORE_KEY='gl_towers_dashboard_towers_v1';
const GL_SELECTED_TOWER_KEY='gl_towers_dashboard_selected_tower_v1';
function defaultTowerData(){
  const seeds=[
    ['tower-01','Tower 01','GreenLab HQ','Online','Vegetative',92,6.1,1.6,22.3,22.8,71,'basil,lettuce,kale'],
    ['tower-02','Tower 02','GreenLab HQ','Online','Flowering',78,6.2,1.8,22.6,23.2,68,'strawberry,basil,mint'],
    ['tower-03','Tower 03','Research Lab','Online','Vegetative',88,6.0,1.5,22.1,22.4,70,'parsley,spinach,coriander'],
    ['tower-04','Tower 04','Research Lab','Offline','Empty',0,'—','—','—','—','—',''],
    ['tower-05','Tower 05','Warehouse 1','Online','Seedling',65,6.3,1.4,21.9,22.1,74,'radish-microgreens,mint,lettuce'],
    ['tower-06','Tower 06','Warehouse 1','Online','Vegetative',90,6.1,1.7,22.4,22.9,72,'kale,basil,spinach'],
    ['tower-07','Tower 07','Retail Store','Online','Flowering',70,6.2,1.9,22.8,23.4,66,'strawberry,oregano,thyme'],
    ['tower-08','Tower 08','Retail Store','Maintenance','Empty',45,6.0,1.5,22.0,22.0,69,'']
  ];
  return seeds.map((s,i)=>({
    id:s[0], name:s[1], location:s[2], status:s[3], stage:s[4], installed:'Aug '+(12+i)+', 2026', type:'Standard (3 modules)',
    reservoir:+s[5]||0, ph:s[6], ec:s[7], waterTemp:s[8], airTemp:s[9], humidity:s[10], lastSync:i===3?'2 h ago':'1 min ago',
    lighting:{enabled:s[3]!=='Offline',preset:s[4]==='Flowering'?'Bloom':s[4]==='Seedling'?'Seedling':'Standard',start:s[4]==='Flowering'?'06:00':'06:00',end:s[4]==='Flowering'?'18:00':'22:00',brightness:s[4]==='Flowering'?100:s[4]==='Seedling'?30:70,photoperiod:s[4]==='Flowering'?12:16},
    pump:{enabled:s[3]!=='Offline',pumpOn:1,pumpPause:s[4]==='Flowering'?75:90,start:'06:00',end:s[4]==='Flowering'?'22:30':'22:00',nightBreak:true,profile:s[4]==='Flowering'?'Flowering Boost':'Standard Hydro'},
    modules:[0,1,2].map((n)=>({name:['Top Module','Middle Module','Bottom Module'][n],plants:(s[11]?s[11].split(','):[]).slice(0,3),waterLevel:+s[5]||0,growDays:[16,21,32][n]}))
  }));
}
function getTowers(){const raw=safeLSGet(GL_TOWER_STORE_KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}return defaultTowerData();}
function saveTowers(towers){safeLSSet(GL_TOWER_STORE_KEY,JSON.stringify(towers));}
function getSelectedTowerId(){const towers=getTowers();const saved=safeLSGet(GL_SELECTED_TOWER_KEY);return towers.some(t=>t.id===saved)?saved:(towers[0]?.id||'');}
function setSelectedTowerId(id){safeLSSet(GL_SELECTED_TOWER_KEY,id);}
function selectedTower(){const towers=getTowers();return towers.find(t=>t.id===getSelectedTowerId())||towers[0]||null;}
function towerPlantName(id){const p=getPlants().find(x=>x.id===id)||APP_PLANTS.find(x=>x.id===id);return p?`${p.emoji||'🌱'} ${p.displayName}`:'Empty';}
function towerPlantOptions(selected=''){return `<option value="">Empty</option>${getPlants().slice(0,254).map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.emoji||'🌱')} ${esc(p.displayName)} — ${esc(p.categoryGL)}</option>`).join('')}`;}
function towerOptions(selected=getSelectedTowerId()){return getTowers().map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.name)} · ${esc(t.location)} · ${esc(t.status)}</option>`).join('')}
function towerStatusPill(status){return `<span class="pill ${status==='Offline'?'gray':status==='Maintenance'?'orange':''}">● ${esc(status)}</span>`}
function towerMetricsEnhanced(){const towers=getTowers();const online=towers.filter(t=>t.status==='Online').length;const activeCrops=towers.reduce((a,t)=>a+t.modules.reduce((b,m)=>b+m.plants.filter(Boolean).length,0),0);const alerts=towers.filter(t=>t.reservoir<30||t.status!=='Online').length;return `<div class="grid metrics-4 mb">${metric('Total Towers',String(towers.length),'Editable tower fleet','▥',green,d.ph,Math.min(100,towers.length*8))}${metric('Online Towers',String(online),`${Math.round(online/(towers.length||1)*100)}% of total`,'◠',green,d.ph,Math.round(online/(towers.length||1)*100))}${metric('Active Crops',String(activeCrops),'Assigned plant slots across towers','☘',green,d.ec)}${metric('Tower Alerts',String(alerts),'Low reservoir / offline / maintenance','⚠',alerts?orange:green,d.air)}</div>`}
function towerSelectorCard(t){return `<div class="card card-pad mb tower-select-card"><div><label class="muted"><b>Selected tower</b></label><select id="selectedTowerSelect" class="select" style="width:100%;margin-top:6px">${towerOptions(t?.id)}</select></div><div class="selected-tower-hero">${tower()}<div><h2 style="margin:0 0 6px">${esc(t.name)}</h2><p class="muted">${esc(t.location)} · ${esc(t.type)} · Installed ${esc(t.installed)}</p><div class="tower-chip-row"><span class="tower-control-pill">Reservoir ${esc(t.reservoir)}%</span><span class="tower-control-pill">pH ${esc(t.ph)}</span><span class="tower-control-pill">EC ${esc(t.ec)}</span><span class="tower-control-pill">${esc(t.stage)}</span>${towerStatusPill(t.status)}</div></div></div><div class="inline-actions"><button class="btn green" data-add-tower>+ Add Tower</button><button class="btn danger-btn" data-delete-tower>Delete Tower</button></div></div>`}
function towerDetailsEditor(t){return `<div class="card card-pad"><div class="control-card-head"><div><h2>Tower Details</h2><span class="muted">Modify identity, sensor values and growth state for ${esc(t.name)}.</span></div><button class="btn green" data-save-tower-details>Save details</button></div><input type="hidden" id="towerId" value="${esc(t.id)}"><div class="tower-form-grid"><div class="field"><label>Tower name</label><input id="towerName" value="${esc(t.name)}"></div><div class="field"><label>Location</label><input id="towerLocation" value="${esc(t.location)}"></div><div class="field"><label>Status</label><select id="towerStatus"><option ${t.status==='Online'?'selected':''}>Online</option><option ${t.status==='Offline'?'selected':''}>Offline</option><option ${t.status==='Maintenance'?'selected':''}>Maintenance</option></select></div><div class="field"><label>Stage</label><select id="towerStage"><option ${t.stage==='Vegetative'?'selected':''}>Vegetative</option><option ${t.stage==='Flowering'?'selected':''}>Flowering</option><option ${t.stage==='Seedling'?'selected':''}>Seedling</option><option ${t.stage==='Empty'?'selected':''}>Empty</option></select></div><div class="field"><label>Installed</label><input id="towerInstalled" value="${esc(t.installed)}"></div><div class="field"><label>Tower type</label><input id="towerType" value="${esc(t.type)}"></div><div class="field"><label>Reservoir %</label><input id="towerReservoir" type="number" min="0" max="100" value="${esc(t.reservoir)}"></div><div class="field"><label>pH</label><input id="towerPh" value="${esc(t.ph)}"></div><div class="field"><label>EC</label><input id="towerEc" value="${esc(t.ec)}"></div><div class="field"><label>Water temp °C</label><input id="towerWaterTemp" value="${esc(t.waterTemp)}"></div><div class="field"><label>Air temp °C</label><input id="towerAirTemp" value="${esc(t.airTemp)}"></div><div class="field"><label>Humidity %</label><input id="towerHumidity" value="${esc(t.humidity)}"></div></div></div>`}
function towerLightingControl(t){return `<div class="card card-pad"><div class="control-card-head"><div><h2>Lighting Control</h2><span class="muted">Per-tower LED schedule and intensity.</span></div><span class="toggle ${t.lighting.enabled?'on':''}" data-toggle-light></span></div><div class="field mb"><label>Preset</label><select id="lightPreset"><option ${t.lighting.preset==='Seedling'?'selected':''}>Seedling</option><option ${t.lighting.preset==='Standard'?'selected':''}>Standard</option><option ${t.lighting.preset==='Bloom'?'selected':''}>Bloom</option><option ${t.lighting.preset==='Custom'?'selected':''}>Custom</option><option ${t.lighting.preset==='Off'?'selected':''}>Off</option></select></div><div class="control-row"><div class="field"><label>Start</label><input id="lightStart" type="time" value="${esc(t.lighting.start)}"></div><div class="field"><label>End</label><input id="lightEnd" type="time" value="${esc(t.lighting.end)}"></div></div><div class="field"><label>Brightness</label><div class="range-inline"><input id="lightBrightness" type="range" min="0" max="100" value="${esc(t.lighting.brightness)}" oninput="this.nextElementSibling.value=this.value+'%'"><output>${esc(t.lighting.brightness)}%</output></div></div><div class="field mt"><label>Photoperiod hours</label><div class="range-inline"><input id="lightPhotoperiod" type="range" min="0" max="24" value="${esc(t.lighting.photoperiod)}" oninput="this.nextElementSibling.value=this.value+' h'"><output>${esc(t.lighting.photoperiod)} h</output></div></div><button class="btn green full mt" data-save-lighting>Save lighting for ${esc(t.name)}</button></div>`}
function towerPumpControl(t){return `<div class="card card-pad"><div class="control-card-head"><div><h2>Pump / Irrigation</h2><span class="muted">Independent pump cycle for this tower.</span></div><span class="toggle ${t.pump.enabled?'on':''}" data-toggle-pump></span></div><div class="control-row"><div class="field"><label>Pump ON min</label><input id="pumpOn" type="number" min="0" value="${esc(t.pump.pumpOn)}"></div><div class="field"><label>Pump pause min</label><input id="pumpPause" type="number" min="1" value="${esc(t.pump.pumpPause)}"></div></div><div class="control-row"><div class="field"><label>Window start</label><input id="pumpStart" type="time" value="${esc(t.pump.start)}"></div><div class="field"><label>Window end</label><input id="pumpEnd" type="time" value="${esc(t.pump.end)}"></div></div><div class="field"><label>Profile</label><input id="pumpProfile" value="${esc(t.pump.profile)}"></div><div class="mini-toggle-field mt"><span><b>Night break</b><br><span class="muted">Pause irrigation outside the window</span></span><span class="toggle ${t.pump.nightBreak?'on':''}" data-toggle-night></span></div><div class="inline-actions mt"><button class="btn soft" data-manual-pump-test>▶ Manual pump test</button><button class="btn green" data-save-pump>Save pump settings</button></div></div>`}
function towerPlantsControl(t){return `<div class="card card-pad"><div class="control-card-head"><div><h2>Plants / Modules</h2><span class="muted">Assign different crops to this tower only.</span></div><button class="btn green" data-save-tower-plants>Save plants</button></div>${t.modules.map((m,mi)=>`<div class="module-plant-editor"><h4><span class="module-index" style="display:inline-grid;margin-right:8px">${mi+1}</span>${esc(m.name)}</h4><div class="slot-grid">${[0,1,2].map(si=>`<div class="field"><label>Slot ${si+1}</label><select data-module="${mi}" data-slot="${si}" class="towerPlantSlot">${towerPlantOptions(m.plants[si]||'')}</select></div>`).join('')}</div><div class="crop-tags mt">${m.plants.filter(Boolean).map(id=>`<span class="tag">${esc(towerPlantName(id))}</span>`).join('')||'<span class="muted">No plants assigned</span>'}</div></div>`).join('')}</div>`}
function towerInventoryEnhanced(selectedId){const towers=getTowers();const rows=towers.map(t=>`<tr class="${t.id===selectedId?'tower-row-selected':''}" data-tower-row="${esc(t.id)}"><td class="tower-name">${tiny()}<span><b>${esc(t.name)}</b><br><span class="muted">${esc(t.location)}</span></span></td><td>${towerStatusPill(t.status)}</td><td>${esc(t.stage)}</td><td><div class="row-progress"><span style="width:${esc(t.reservoir)}%"></span></div><b>${esc(t.reservoir)}%</b></td><td>${esc(t.ph)}</td><td>${esc(t.ec)}</td><td>${esc(t.lighting.enabled?'On':'Off')} · ${esc(t.lighting.brightness)}%</td><td>${esc(t.pump.enabled?'Active':'Paused')} · ${esc(t.pump.pumpOn)}/${esc(t.pump.pumpPause)} min</td><td>${t.modules.reduce((a,m)=>a+m.plants.filter(Boolean).length,0)} slots</td><td><button class="btn ghost" data-select-tower="${esc(t.id)}">Select</button></td></tr>`).join('');return `<div class="card card-pad table-card mt"><div class="section-title"><div><h2>Tower Fleet</h2><span class="muted">Click Select to load and control that tower.</span></div><input id="towerSearch" class="search" placeholder="Search towers..."></div>${table(rows,['Tower','Status','Stage','Reservoir','pH','EC','Lighting','Pump','Plants','Action'])}</div>`}
function pageTowers(){const t=selectedTower();if(!t)return `<div class="card card-pad tower-empty-note"><h2>No towers yet</h2><button class="btn green" data-add-tower>+ Add your first tower</button></div>`;return `${towerMetricsEnhanced()}${towerSelectorCard(t)}<div class="tower-editor-grid mb">${towerDetailsEditor(t)}<div class="card card-pad"><h2 class="card-title">Live Tower Snapshot</h2><div class="selected-tower-hero">${tower()}<div class="insights-grid"><div class="insight-mini"><b>Reservoir</b><div class="num">${esc(t.reservoir)}%</div>${bar(t.reservoir)}</div><div class="insight-mini"><b>pH / EC</b><div class="num">${esc(t.ph)} / ${esc(t.ec)}</div><span class="ok">Optimal</span></div><div class="insight-mini"><b>Water Temp</b><div class="num">${esc(t.waterTemp)}°C</div><span class="ok">Optimal</span></div><div class="insight-mini"><b>Humidity</b><div class="num">${esc(t.humidity)}%</div><span class="ok">Good</span></div></div></div></div></div><div class="tower-control-grid">${towerLightingControl(t)}${towerPumpControl(t)}${towerPlantsControl(t)}</div>${towerInventoryEnhanced(t.id)}`}
pages.towers=pageTowers;
function towerOverview(){const t=selectedTower()||defaultTowerData()[0];return `<div class="card card-pad"><h2 class="card-title">Tower Overview — ${esc(t.name)}</h2><div class="tower-overview">${tower()}<div class="kv"><b>Location</b><span>${esc(t.location)}</span><span class="ok">${esc(t.status)}</span><b>Water Level</b><span>${esc(t.reservoir)}%</span><span class="ok">${t.reservoir>=80?'Optimal':t.reservoir>=30?'Good':'Low'}</span><b>Pump Status</b><span>${t.pump.enabled?'Active':'Paused'}</span><span class="ok">${t.pump.enabled?'Normal':'Off'}</span><b>Irrigation</b><span>${esc(t.pump.pumpOn)} / ${esc(t.pump.pumpPause)} min <span class="sub">${esc(t.pump.start)}–${esc(t.pump.end)}</span></span><span class="ok">${t.pump.enabled?'Active':'Paused'}</span><b>LED Lights</b><span>${esc(t.lighting.start)} - ${esc(t.lighting.end)} <span class="sub">${esc(t.lighting.brightness)}% intensity</span></span><span class="ok">${t.lighting.enabled?'Active':'Off'}</span><b>Stage</b><span>${esc(t.stage)} <span class="sub">${t.modules.reduce((a,m)=>a+m.plants.filter(Boolean).length,0)} plants assigned</span></span><span class="ok">Selected</span></div></div><a class="btn full ghost mt" href="#towers">Control this tower →</a></div>`}

sidebar=function(active){const t=selectedTower()||defaultTowerData()[0];return `<aside class="sidebar"><div class="brand">${ico('☘')}<span>GL TOWERS</span></div><nav class="nav">${nav.map(n=>`<a href="#${n[0]}" class="${active==n[0]?'active':''}">${ico(n[2])}<span>${n[1]}</span></a>`).join('')}</nav><div class="side-bottom"><div class="tower-mini">${tower('mini-tower')}<div class="side-info"><strong>${esc(t.location)}</strong><span>${esc(t.name)}</span><span class="online-pill"><span class="dot"></span>${esc(t.status)}</span></div><span class="chev">⌄</span></div><div class="user-mini"><div class="avatar">AA</div><div class="side-info"><strong>Admin</strong><span>admin@gl-towers.com</span></div><span class="chev">⌄</span></div></div></aside>`}
function updateTower(id,patcher){let towers=getTowers();const idx=towers.findIndex(t=>t.id===id);if(idx<0)return;const next=typeof patcher==='function'?patcher(towers[idx]):{...towers[idx],...patcher};towers[idx]=next;saveTowers(towers);}
function addTower(){let towers=getTowers();const n=towers.length+1;const base=defaultTowerData()[0];const id='tower-'+String(Date.now());const nt=JSON.parse(JSON.stringify(base));Object.assign(nt,{id,name:`Tower ${String(n).padStart(2,'0')}`,location:'New Site',status:'Online',stage:'Empty',reservoir:100,ph:6.1,ec:1.6,installed:'Sep 2, 2026'});nt.modules=nt.modules.map(m=>({...m,plants:[],growDays:0}));towers.unshift(nt);saveTowers(towers);setSelectedTowerId(id);render();}
document.addEventListener('click',e=>{
  const sel=e.target.closest('[data-select-tower]');if(sel){setSelectedTowerId(sel.dataset.selectTower);render();return;}
  if(e.target.closest('[data-add-tower]')){addTower();return;}
  if(e.target.closest('[data-delete-tower]')){const t=selectedTower();if(!t)return;if(confirm(`Delete ${t.name}? This only removes it from the dashboard local data.`)){let towers=getTowers().filter(x=>x.id!==t.id);saveTowers(towers);setSelectedTowerId(towers[0]?.id||'');render();}return;}
  if(e.target.closest('[data-toggle-light]')){const t=selectedTower();updateTower(t.id,x=>({...x,lighting:{...x.lighting,enabled:!x.lighting.enabled}}));render();return;}
  if(e.target.closest('[data-toggle-pump]')){const t=selectedTower();updateTower(t.id,x=>({...x,pump:{...x.pump,enabled:!x.pump.enabled}}));render();return;}
  if(e.target.closest('[data-toggle-night]')){const t=selectedTower();updateTower(t.id,x=>({...x,pump:{...x.pump,nightBreak:!x.pump.nightBreak}}));render();return;}
  if(e.target.closest('[data-save-tower-details]')){const id=document.getElementById('towerId').value;updateTower(id,x=>({...x,name:document.getElementById('towerName').value.trim()||x.name,location:document.getElementById('towerLocation').value.trim()||x.location,status:document.getElementById('towerStatus').value,stage:document.getElementById('towerStage').value,installed:document.getElementById('towerInstalled').value,type:document.getElementById('towerType').value,reservoir:+document.getElementById('towerReservoir').value||0,ph:document.getElementById('towerPh').value,ec:document.getElementById('towerEc').value,waterTemp:document.getElementById('towerWaterTemp').value,airTemp:document.getElementById('towerAirTemp').value,humidity:document.getElementById('towerHumidity').value,lastSync:'Just now'}));render();return;}
  if(e.target.closest('[data-save-lighting]')){const t=selectedTower();updateTower(t.id,x=>({...x,lighting:{...x.lighting,preset:document.getElementById('lightPreset').value,start:document.getElementById('lightStart').value,end:document.getElementById('lightEnd').value,brightness:+document.getElementById('lightBrightness').value,photoperiod:+document.getElementById('lightPhotoperiod').value}}));render();return;}
  if(e.target.closest('[data-save-pump]')){const t=selectedTower();updateTower(t.id,x=>({...x,pump:{...x.pump,pumpOn:+document.getElementById('pumpOn').value,pumpPause:+document.getElementById('pumpPause').value,start:document.getElementById('pumpStart').value,end:document.getElementById('pumpEnd').value,profile:document.getElementById('pumpProfile').value}}));render();return;}
  if(e.target.closest('[data-manual-pump-test]')){alert('Manual pump test started for '+(selectedTower()?.name||'selected tower')+'.');return;}
  if(e.target.closest('[data-save-tower-plants]')){const t=selectedTower();const slots=[...document.querySelectorAll('.towerPlantSlot')];updateTower(t.id,x=>{const modules=x.modules.map(m=>({...m,plants:[...m.plants]}));slots.forEach(s=>{modules[+s.dataset.module].plants[+s.dataset.slot]=s.value;});return {...x,modules,lastSync:'Just now'};});render();return;}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='selectedTowerSelect'){setSelectedTowerId(e.target.value);render();}});

/* ─────────────────────────────────────────────────────────────
   App-style Add Tower wizard
   This replaces the instant add action with a full setup flow.
   Every created tower gets the complete feature set:
   sensors, lighting, pump/irrigation, modules and plant slots.
────────────────────────────────────────────────────────────── */
function nextTowerName(){return `Tower ${String(getTowers().length+1).padStart(2,'0')}`}
function appTowerPlantSlot(moduleIndex,slotIndex,selected=''){
  return `<div class="field"><label>Module ${moduleIndex+1} · Slot ${slotIndex+1}</label><select data-new-module="${moduleIndex}" data-new-slot="${slotIndex}" class="newTowerPlantSlot">${towerPlantOptions(selected)}</select></div>`;
}
function buildNewTowerModules(count=3){
  const defaults=['basil','lettuce','kale','parsley','mint','spinach','strawberry','coriander','radish-microgreens'];
  let html='';
  for(let i=0;i<count;i++){
    html+=`<div class="module-builder-card"><h4><span class="module-index" style="display:inline-grid;margin-right:8px">${i+1}</span>${['Top','Middle','Bottom','Module 4','Module 5','Module 6'][i]||('Module '+(i+1))}</h4><div class="slot-grid">${[0,1,2].map(si=>appTowerPlantSlot(i,si,defaults[i*3+si]||'')).join('')}</div></div>`;
  }
  return html;
}

lled" value="${today}"></div><div class="field"><label>Modules</label><select id="newTowerModuleCount"><option selected>3</option><option>1</option><option>2</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Initial reservoir %</label><input id="newTowerReservoir" type="number" min="0" max="100" value="100"></div><div class="field"><label>pH</label><input id="newTowerPh" value="6.1"></div><div class="field"><label>EC</label><input id="newTowerEc" value="1.6"></div></div></div><div class="wizard-panel"><h3>Lighting preset</h3><div class="preset-grid mb"><div class="preset-card active" data-new-light-preset="Standard" data-bright="70" data-photo="16" data-start="06:00" data-end="22:00"><b>☼ Standard</b><br><span class="muted">70% · 16h</span></div><div class="preset-card" data-new-light-preset="Seedling" data-bright="30" data-photo="16" data-start="06:00" data-end="22:00"><b>☘ Seedling</b><br><span class="muted">30% · 16h</span></div><div class="preset-card" data-new-light-preset="Bloom" data-bright="100" data-photo="12" data-start="06:00" data-end="18:00"><b>✣ Bloom</b><br><span class="muted">100% · 12h</span></div></div><div class="tower-form-grid"><div class="field"><label>Preset</label><input id="newLightPreset" value="Standard"></div><div class="field"><label>Brightness %</label><input id="newLightBrightness" type="number" min="0" max="100" value="70"></div><div class="field"><label>Start</label><input id="newLightStart" type="time" value="06:00"></div><div class="field"><label>End</label><input id="newLightEnd" type="time" value="22:00"></div><div class="field"><label>Photoperiod h</label><input id="newLightPhotoperiod" type="number" min="0" max="24" value="16"></div><div class="mini-toggle-field"><span><b>Lights enabled</b></span><span class="toggle on" data-new-light-enabled></span></div></div></div><div class="wizard-panel"><h3>Pump / irrigation preset</h3><div class="preset-grid mb"><div class="preset-card mp cycle, irrigation window and night break</div><div><b>Plants:</b><br>module-by-module crop assignment from your app plant library</div></div></div></div></div><div class="modal-footer"><span class="muted">This will add a complete tower to the dashboard and select it automatically.</span><div class="inline-actions"><button class="btn ghost" data-close-tower-modal>Cancel</button><button class="btn green" data-create-tower-from-wizard>Create tower</button></div></div></div></div>`;

function openTowerAddDialog(){document.getElementById('towerAddModal')?.remove();document.body.insertAdjacentHTML('beforeend',towerAddWizardHtml());}
function closeTowerAddDialog(){document.getElementById('towerAddModal')?.remove();}
function boolToggle(selector){return document.querySelector(selector)?.classList.contains('on')}
function createTowerFromWizard(){
  const name=document.getElementById('newTowerName')?.value.trim()||nextTowerName();
  const count=+(document.getElementById('newTowerModuleCount')?.value||3);
  const id='tower-'+slugifyPlant(name)+'-'+Date.now();
  const slots=[...document.querySelectorAll('.newTowerPlantSlot')];
  const modules=[];
  for(let i=0;i<count;i++){
    modules.push({name:['Top Module','Middle Module','Bottom Module'][i]||`Module ${i+1}`,plants:slots.filter(s=>+s.dataset.newModule===i).map(s=>s.value).filter(Boolean),waterLevel:+(document.getElementById('newTowerReservoir')?.value||100),growDays:0});
  }
  const t={
    id,name,
    location:document.getElementById('newTowerLocation')?.value.trim()||'GreenLab HQ',
    status:document.getElementById('newTowerStatus')?.value||'Online',
    stage:document.getElementById('newTowerStage')?.value||'Vegetative',
    installed:document.getElementById('newTowerInstalled')?.value||'Sep 2, 2026',
    type:`Standard (${count} modules)`, serial:document.getElementById('newTowerSerial')?.value||'', hardware:document.getElementById('newTowerHw')?.value||'',
    reservoir:+(document.getElementById('newTowerReservoir')?.value||100), ph:document.getElementById('newTowerPh')?.value||'6.1', ec:document.getElementById('newTowerEc')?.value||'1.6', waterTemp:'22.3', airTemp:'22.8', humidity:'71', lastSync:'Just now',
    lighting:{enabled:boolToggle('[data-new-light-enabled]'),preset:document.getElementById('newLightPreset')?.value||'Standard',start:document.getElementById('newLightStart')?.value||'06:00',end:document.getElementById('newLightEnd')?.value||'22:00',brightness:+(document.getElementById('newLightBrightness')?.value||70),photoperiod:+(document.getElementById('newLightPhotoperiod')?.value||16)},
    pump:{enabled:boolToggle('[data-new-pump-enabled]'),pumpOn:+(document.getElementById('newPumpOn')?.value||1),pumpPause:+(document.getElementById('newPumpPause')?.value||90),start:document.getElementById('newPumpStart')?.value||'06:00',end:document.getElementById('newPumpEnd')?.value||'22:00',nightBreak:boolToggle('[data-new-night-enabled]'),profile:document.getElementById('newPumpProfile')?.value||'Standard Hydro'},
    modules
  };
  const towers=getTowers();towers.unshift(t);saveTowers(towers);setSelectedTowerId(t.id);closeTowerAddDialog();render();
}
// Capture add clicks before the older instant-add listener, so the app-style wizard opens instead.
document.addEventListener('click',e=>{
  const add=e.target.closest('[data-add-tower]');
  if(add){e.preventDefault();e.stopImmediatePropagation();openTowerAddDialog();return;}
},true);
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close-tower-modal]')){closeTowerAddDialog();return;}
  const light=e.target.closest('[data-new-light-preset]');
  if(light){document.querySelectorAll('[data-new-light-preset]').forEach(x=>x.classList.remove('active'));light.classList.add('active');document.getElementById('newLightPreset').value=light.dataset.newLightPreset;document.getElementById('newLightBrightness').value=light.dataset.bright;document.getElementById('newLightPhotoperiod').value=light.dataset.photo;document.getElementById('newLightStart').value=light.dataset.start;document.getElementById('newLightEnd').value=light.dataset.end;return;}
  const pump=e.target.closest('[data-new-pump-preset]');
  if(pump){document.querySelectorAll('[data-new-pump-preset]').forEach(x=>x.classList.remove('active'));pump.classList.add('active');document.getElementById('newPumpProfile').value=pump.dataset.newPumpPreset;document.getElementById('newPumpOn').value=pump.dataset.on;document.getElementById('newPumpPause').value=pump.dataset.pause;document.getElementById('newPumpEnd').value=pump.dataset.end;return;}
  if(e.target.closest('[data-new-light-enabled]')||e.target.closest('[data-new-pump-enabled]')||e.target.closest('[data-new-night-enabled]')){e.target.closest('.toggle').classList.toggle('on');return;}
  if(e.target.closest('[data-create-tower-from-wizard]')){createTowerFromWizard();return;}
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='newTowerModuleCount'){
    const count=+e.target.value||3;const holder=document.getElementById('newTowerModules');if(holder)holder.innerHTML=buildNewTowerModules(count);const sum=document.getElementById('newTowerModuleSummary');if(sum)sum.textContent=`${count} modules · ${count*3} plant slots`;
  }
});

/* ─────────────────────────────────────────────────────────────
   Warehouse hierarchy
   - Select Warehouse under GL TOWERS
   - Then select a tower inside that warehouse
   - Add / delete warehouses
   - Adding a tower defaults to the selected warehouse
────────────────────────────────────────────────────────────── */
const GL_WAREHOUSE_STORE_KEY='gl_towers_dashboard_warehouses_v1';
const GL_SELECTED_WAREHOUSE_KEY='gl_towers_dashboard_selected_warehouse_v1';
function defaultWarehouses(){
  const names=[...new Set(getTowers().map(t=>t.location||'Unassigned Warehouse'))];
  return names.map((name,i)=>({id:'warehouse-'+slugifyPlant(name),name,address:i===0?'GreenLab HQ main facility':'',notes:'',status:'Active'}));
}
function getWarehouses(){
  const raw=safeLSGet(GL_WAREHOUSE_STORE_KEY);
  let list=null;
  if(raw){try{list=JSON.parse(raw)}catch(e){}}
  if(!Array.isArray(list)||!list.length) list=defaultWarehouses();
  // Make sure locations already used by towers exist as warehouses.
  const existing=new Set(list.map(w=>w.name));
  getTowers().forEach(t=>{if(t.location&&!existing.has(t.location)){list.push({id:'warehouse-'+slugifyPlant(t.location),name:t.location,address:'',notes:'Created from existing tower location',status:'Active'});existing.add(t.location);}});
  return list;
}
function saveWarehouses(w){safeLSSet(GL_WAREHOUSE_STORE_KEY,JSON.stringify(w));}
function getSelectedWarehouseId(){
  const whs=getWarehouses();
  const saved=safeLSGet(GL_SELECTED_WAREHOUSE_KEY);
  if(whs.some(w=>w.id===saved)) return saved;
  const savedTower=safeLSGet(GL_SELECTED_TOWER_KEY);
  const tower=getTowers().find(t=>t.id===savedTower);
  const byTower=tower&&whs.find(w=>w.name===tower.location);
  return (byTower||whs[0]||{}).id||'';
}
function selectedWarehouse(){return getWarehouses().find(w=>w.id===getSelectedWarehouseId())||getWarehouses()[0]||null;}
function towersForWarehouse(warehouse=selectedWarehouse()){return getTowers().filter(t=>warehouse&&t.location===warehouse.name);}
function setSelectedWarehouseId(id){
  safeLSSet(GL_SELECTED_WAREHOUSE_KEY,id);
  const wh=getWarehouses().find(w=>w.id===id);
  const first=towersForWarehouse(wh)[0];
  if(first) setSelectedTowerId(first.id);
}
function getSelectedTowerId(){
  const towers=getTowers();
  const wh=selectedWarehouse();
  const scoped=towersForWarehouse(wh);
  const saved=safeLSGet(GL_SELECTED_TOWER_KEY);
  if(scoped.some(t=>t.id===saved)) return saved;
  if(scoped[0]) return scoped[0].id;
  return towers[0]?.id||'';
}
function selectedTower(){const towers=getTowers();return towers.find(t=>t.id===getSelectedTowerId())||null;}
function globalTowerSelector(active){
  const wh=selectedWarehouse();
  const scoped=towersForWarehouse(wh);
  const t=selectedTower();
  return `<div class="global-tower-select"><label>Warehouse</label><div class="global-warehouse-stack"><select id="globalWarehouseSelect">${getWarehouses().map(w=>`<option value="${esc(w.id)}" ${w.id===(wh&&wh.id)?'selected':''}>🏬 ${esc(w.name)} · ${towersForWarehouse(w).length} towers</option>`).join('')}</select><label>Tower in selected warehouse</label><select id="globalTowerSelect" ${scoped.length?'':'disabled'}>${scoped.length?scoped.map(x=>`<option value="${esc(x.id)}" ${t&&x.id===t.id?'selected':''}>${esc(x.name)} · ${esc(x.status)} · ${esc(x.stage)}</option>`).join(''):'<option>No towers in this warehouse</option>'}</select><div class="warehouse-actions"><button class="warehouse-mini-btn" data-add-warehouse>+ Warehouse</button><button class="warehouse-mini-btn danger" data-delete-warehouse>Delete</button></div></div><div class="global-tower-summary">${tower('mini-tower')}<div><strong>${esc(wh?.name||'No warehouse')}</strong><span>${t?esc(t.name):'No tower selected'} ${t?'· '+esc(t.status):''}</span><span>${t?'Reservoir '+esc(t.reservoir)+'% · '+esc(t.stage):'Add a tower to begin'}</span></div></div></div>`;
}
sidebar=function(active){
  const t=selectedTower(); const wh=selectedWarehouse();
  return `<aside class="sidebar"><div class="brand">${ico('☘')}<span>GL TOWERS</span></div>${globalTowerSelector(active)}<nav class="nav">${nav.map(n=>`<a href="#${n[0]}" class="${active==n[0]?'active':''}">${ico(n[2])}<span>${n[1]}</span></a>`).join('')}</nav><div class="side-bottom"><div class="tower-mini">${tower('mini-tower')}<div class="side-info"><strong>${esc(wh?.name||'Warehouse')}</strong><span>${t?esc(t.name):'No tower'}</span><span class="online-pill"><span class="dot"></span>${t?esc(t.status):'Empty'}</span></div><span class="chev">⌄</span></div><div class="user-mini"><div class="avatar">AA</div><div class="side-info"><strong>Admin</strong><span>admin@gl-towers.com</span></div><span class="chev">⌄</span></div></div></aside>`
}
function openWarehouseDialog(){
  document.getElementById('warehouseModal')?.remove();
  document.body.insertAdjacentHTML('beforeend',`<div class="warehouse-modal-backdrop" id="warehouseModal"><div class="warehouse-modal"><div class="warehouse-modal-head"><h2>Add Warehouse</h2><button class="tower-modal-close" data-close-warehouse-modal>×</button></div><div class="warehouse-modal-body"><div class="warehouse-form-grid"><div class="field"><label>Warehouse name</label><input id="newWarehouseName" placeholder="Warehouse 2"></div><div class="field"><label>Status</label><select id="newWarehouseStatus"><option>Active</option><option>Maintenance</option><option>Offline</option></select></div><div class="field" style="grid-column:1/-1"><label>Address / site</label><input id="newWarehouseAddress" placeholder="GreenLab site address"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea id="newWarehouseNotes" placeholder="Optional notes"></textarea></div></div><div class="inline-actions mt"><button class="btn ghost" data-close-warehouse-modal>Cancel</button><button class="btn green" data-create-warehouse>Create warehouse</button></div></div></div></div>`);
  setTimeout(()=>document.getElementById('newWarehouseName')?.focus(),0);
}
function closeWarehouseDialog(){document.getElementById('warehouseModal')?.remove();}
function createWarehouseFromForm(){
  const name=(document.getElementById('newWarehouseName')?.value||'').trim();
  if(!name){alert('Please enter a warehouse name.');return;}
  let whs=getWarehouses();
  if(whs.some(w=>w.name.toLowerCase()===name.toLowerCase())){alert('This warehouse already exists.');return;}
  const wh={id:'warehouse-'+slugifyPlant(name)+'-'+Date.now(),name,address:document.getElementById('newWarehouseAddress')?.value||'',notes:document.getElementById('newWarehouseNotes')?.value||'',status:document.getElementById('newWarehouseStatus')?.value||'Active'};
  whs.push(wh);saveWarehouses(whs);setSelectedWarehouseId(wh.id);closeWarehouseDialog();render();saveToast('Warehouse created');
}
function deleteSelectedWarehouse(){
  const wh=selectedWarehouse(); if(!wh)return;
  const count=towersForWarehouse(wh).length;
  const msg=count?`Delete warehouse "${wh.name}" and its ${count} tower(s)?`:`Delete empty warehouse "${wh.name}"?`;
  if(!confirm(msg))return;
  const whs=getWarehouses().filter(w=>w.id!==wh.id);
  saveWarehouses(whs.length?whs:[{id:'warehouse-main',name:'Main Warehouse',address:'',notes:'',status:'Active'}]);
  if(count){saveTowers(getTowers().filter(t=>t.location!==wh.name));}
  const next=getWarehouses()[0]; if(next)setSelectedWarehouseId(next.id);
  render();saveToast('Warehouse deleted');
}
function warehousePanel(){
  const wh=selectedWarehouse(); const whs=getWarehouses(); const scoped=towersForWarehouse(wh);
  return `<div class="card card-pad mb"><div class="section-title"><div><h2>Warehouse → Tower Selection</h2><span class="muted">Choose a warehouse first, then select one tower under it. All modifications apply to that tower.</span></div><div class="tower-context-actions"><button class="btn green" data-add-warehouse>+ Add Warehouse</button><button class="btn ghost" data-add-tower>+ Add Tower to ${esc(wh?.name||'Warehouse')}</button><button class="btn danger-btn" data-delete-warehouse>Delete Warehouse</button></div></div><div class="warehouse-panel"><div class="field"><label>Warehouse</label><select id="pageWarehouseSelect">${whs.map(w=>`<option value="${esc(w.id)}" ${wh&&w.id===wh.id?'selected':''}>${esc(w.name)} (${towersForWarehouse(w).length} towers)</option>`).join('')}</select></div><div class="field"><label>Tower under warehouse</label><select id="pageTowerSelect" ${scoped.length?'':'disabled'}>${scoped.length?scoped.map(t=>`<option value="${esc(t.id)}" ${selectedTower()&&t.id===selectedTower().id?'selected':''}>${esc(t.name)} · ${esc(t.status)} · ${esc(t.stage)}</option>`).join(''):'<option>No towers in this warehouse</option>'}</select></div><div>${scoped.length?`<span class="tower-control-pill">${scoped.length} towers in ${esc(wh.name)}</span>`:'<div class="warehouse-empty">No towers yet. Add one to this warehouse.</div>'}</div></div><div class="warehouse-tree mt">${whs.map(w=>`<div class="warehouse-node ${wh&&w.id===wh.id?'active':''}" data-select-warehouse="${esc(w.id)}"><b>🏬 ${esc(w.name)}</b><span>${towersForWarehouse(w).length} tower(s) · ${esc(w.status||'Active')}</span></div>`).join('')}</div></div>`;
}
const previousTowerPageWithControls=pages.towers;
pages.towers=function(){return warehousePanel()+previousTowerPageWithControls();};
const oldTowerAddWizardHtml=towerAddWizardHtml;
towerAddWizardHtml=function(){
  const wh=selectedWarehouse();
  let html=oldTowerAddWizardHtml();
  if(wh){html=html.replace('value="GreenLab HQ"',`value="${esc(wh.name)}"`);}
  return html;
}
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='globalWarehouseSelect'){setSelectedWarehouseId(e.target.value);render();return;}
  if(e.target&&e.target.id==='pageWarehouseSelect'){setSelectedWarehouseId(e.target.value);render();return;}
  if(e.target&&e.target.id==='pageTowerSelect'){setSelectedTowerId(e.target.value);render();return;}
},true);
document.addEventListener('click',e=>{
  const node=e.target.closest('[data-select-warehouse]');if(node){setSelectedWarehouseId(node.dataset.selectWarehouse);render();return;}
  if(e.target.closest('[data-add-warehouse]')){e.preventDefault();e.stopImmediatePropagation();openWarehouseDialog();return;}
  if(e.target.closest('[data-delete-warehouse]')){e.preventDefault();e.stopImmediatePropagation();deleteSelectedWarehouse();return;}
  if(e.target.closest('[data-close-warehouse-modal]')){closeWarehouseDialog();return;}
  if(e.target.closest('[data-create-warehouse]')){createWarehouseFromForm();return;}
},true);

/* ─────────────────────────────────────────────────────────────
   Warehouse Manager v2
   - Explicit delete selected warehouse
   - Select warehouse -> see/select/add/modify/delete towers under it
   - Edit warehouse details
────────────────────────────────────────────────────────────── */

function deleteTowerById(id){
  const towers=getTowers();
  const t=towers.find(x=>x.id===id);
  if(!t)return;
  if(!confirm(`Delete tower "${t.name}" from warehouse "${t.location}"?`))return;
  const next=towers.filter(x=>x.id!==id);
  saveTowers(next);
  const wh=selectedWarehouse();
  const nextInWh=next.find(x=>wh&&x.location===wh.name)||next[0];
  if(nextInWh)setSelectedTowerId(nextInWh.id);
  render();saveToast('Tower deleted');
}
function saveSelectedWarehouseEdit(){
  const id=document.getElementById('editWarehouseId')?.value;
  const oldWh=getWarehouses().find(w=>w.id===id);
  if(!oldWh)return;
  const newName=(document.getElementById('editWarehouseName')?.value||oldWh.name).trim();
  if(!newName){alert('Warehouse name is required.');return;}
  const updated={...oldWh,name:newName,status:document.getElementById('editWarehouseStatus')?.value||'Active',address:document.getElementById('editWarehouseAddress')?.value||'',notes:document.getElementById('editWarehouseNotes')?.value||''};
  saveWarehouses(getWarehouses().map(w=>w.id===id?updated:w));
  if(newName!==oldWh.name){saveTowers(getTowers().map(t=>t.location===oldWh.name?{...t,location:newName}:t));}
  safeLSSet(GL_SELECTED_WAREHOUSE_KEY,id);
  render();saveToast('Warehouse modified');
}
document.addEventListener('click',e=>{
  const delT=e.target.closest('[data-delete-warehouse-tower]');if(delT){e.preventDefault();e.stopImmediatePropagation();deleteTowerById(delT.dataset.deleteWarehouseTower);return;}
  const modT=e.target.closest('[data-modify-warehouse-tower]');if(modT){e.preventDefault();e.stopImmediatePropagation();setSelectedTowerId(modT.dataset.modifyWarehouseTower);render();setTimeout(()=>document.getElementById('towerName')?.scrollIntoView({behavior:'smooth',block:'center'}),0);return;}
  if(e.target.closest('[data-delete-current-tower]')){e.preventDefault();e.stopImmediatePropagation();const t=selectedTower();if(t)deleteTowerById(t.id);return;}
  if(e.target.closest('[data-save-selected-warehouse]')){e.preventDefault();e.stopImmediatePropagation();saveSelectedWarehouseEdit();return;}
  if(e.target.closest('[data-jump-selected-tower]')){e.preventDefault();e.stopImmediatePropagation();document.getElementById('towerName')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
},true);

const GL_SINGLE_TOWER_KEY='gl_towers_single_tower_only_v1';
function getSingleTowerOnly(){
  const raw=safeLSGet(GL_SINGLE_TOWER_KEY);
  if(raw){try{return JSON.parse(raw)}catch(e){}}
  let seed=null;
  try{
    const multi=JSON.parse(localStorage.getItem(GL_TOWER_STORE_KEY)||'[]');
    const saved=localStorage.getItem(GL_SELECTED_TOWER_KEY);
    seed=(Array.isArray(multi)&&(multi.find(t=>t.id===saved)||multi[0]))||null;
  }catch(e){}
  if(!seed) seed=defaultTowerData()[0];
  return {...seed,id:seed.id||'tower-main-only',name:seed.name||'Tower 01',location:SINGLE_WAREHOUSE_NAME,type:seed.type||'Standard (3 modules)'};
}
function saveSingleTowerOnly(t){
  if(!t)return;
  safeLSSet(GL_SINGLE_TOWER_KEY,JSON.stringify({...t,location:SINGLE_WAREHOUSE_NAME}));
}
getTowers=function(){return [getSingleTowerOnly()]};
saveTowers=function(towers){if(Array.isArray(towers))saveSingleTowerOnly(towers[0]);else saveSingleTowerOnly(towers);};

   Warehouse options stay hidden. Tower selector and tower actions are restored.

function normalizeTowerList(list){
  return (Array.isArray(list)&&list.length?list:defaultTowerData()).map(t=>({...t,location:SINGLE_WAREHOUSE_NAME}));
}
getTowers=function(){
  const raw=safeLSGet(GL_TOWER_STORE_KEY);
  if(raw){try{return normalizeTowerList(JSON.parse(raw));}catch(e){}}
  const single=safeLSGet(GL_SINGLE_TOWER_KEY);
  if(single){try{return normalizeTowerList([JSON.parse(single),...defaultTowerData().slice(1)]);}catch(e){}}
  return normalizeTowerList(defaultTowerData());
};
saveTowers=function(towers){safeLSSet(GL_TOWER_STORE_KEY,JSON.stringify(normalizeTowerList(towers)));};
selectedTower=function(){const towers=getTowers();return towers.find(t=>t.id===getSelectedTowerId())||towers[0]||null;};
getSelectedTowerId=function(){const towers=getTowers();const saved=safeLSGet(GL_SELECTED_TOWER_KEY);return towers.some(t=>t.id===saved)?saved:(towers[0]?.id||'');};
setSelectedTowerId=function(id){safeLSSet(GL_SELECTED_TOWER_KEY,id);};

function deleteTowerNormal(id){
  const towers=getTowers();
  const t=towers.find(x=>x.id===id);

  const next=towers.filter(x=>x.id!==id);

}

/* ─────────────────────────────────────────────────────────────
   Final interaction hardening
   - Internal Settings anchors no longer break routing
   - Dashboard quick-action cards are clickable
   - Add/save actions show feedback
   - Details menus close after choosing an option
────────────────────────────────────────────────────────────── */
function closeOpenMenus(){document.querySelectorAll('details.option-menu[open]').forEach(d=>d.removeAttribute('open'));}
function navigateAndFocus(hash, selector){location.hash=hash;setTimeout(()=>document.querySelector(selector)?.scrollIntoView({behavior:'smooth',block:'center'}),80);}
document.addEventListener('click',e=>{
  const settingsAnchor=e.target.closest('a[href^="#settings-"]');
  if(settingsAnchor){e.preventDefault();const id=settingsAnchor.getAttribute('href').slice(1);document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.settings-nav-card a').forEach(a=>a.classList.toggle('active',a===settingsAnchor));return;}
  const quick=e.target.closest('.dashboard-actions-row .action');
  if(quick){const txt=(quick.innerText||'').toLowerCase();if(txt.includes('pump')){alert('Manual pump test started for '+(selectedTower()?.name||'selected tower')+'.');}else if(txt.includes('lighting')){location.hash='#lighting';}else if(txt.includes('sensor')){location.hash='#sensors';}else if(txt.includes('plant')){location.hash='#plants';}else if(txt.includes('export')){location.hash='#reports';}else if(txt.includes('system')){saveToast('System check complete: all selected tower systems operational');}return;}
  if(e.target.closest('[data-select-tower],[data-add-tower-normal],[data-delete-current-tower-normal],[data-delete-tower-normal],[data-rename-current-tower],[data-modify-current-tower],[data-save-tower-details],[data-save-lighting],[data-save-pump],[data-save-tower-plants],[data-create-tower-from-wizard]')){setTimeout(closeOpenMenus,0);}
},true);
document.addEventListener('click',e=>{
  if(e.target.closest('[data-save-tower-details]')) setTimeout(()=>saveToast('Tower details saved'),60);
  if(e.target.closest('[data-save-lighting]')) setTimeout(()=>saveToast('Lighting settings saved'),60);
  if(e.target.closest('[data-save-pump]')) setTimeout(()=>saveToast('Pump settings saved'),60);
  if(e.target.closest('[data-save-tower-plants]')) setTimeout(()=>saveToast('Plant assignments saved'),60);
  if(e.target.closest('[data-create-tower-from-wizard]')) setTimeout(()=>saveToast('Tower created and selected'),120);
});

function isItalian(){try{return getAppSettings && getAppSettings().language==='it'}catch(e){return false}}
function setLanguageShell(){
  const it=isItalian();
  GL_NAV_EN.forEach((row,i)=>{nav[i][1]=it?(GL_NAV_IT[row[0]]||row[1]):row[1];});
  Object.keys(GL_INFO_EN).forEach(k=>{info[k]=it?(GL_INFO_IT[k]||GL_INFO_EN[k]):GL_INFO_EN[k];});
  try{document.documentElement.lang=it?'it':'en'}catch(e){}
}
function translateTextNodesItalian(){
  if(!isItalian()) return;
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(node){
    if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    const p=node.parentElement;
    if(!p || ['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const raw=n.nodeValue, trimmed=raw.trim();
    if(GL_TEXT_IT[trimmed]) n.nodeValue=raw.replace(trimmed,GL_TEXT_IT[trimmed]);
  });
  document.querySelectorAll('input[placeholder], textarea[placeholder]').forEach(el=>{const p=el.getAttribute('placeholder'); if(GL_TEXT_IT[p]) el.setAttribute('placeholder',GL_TEXT_IT[p]);});
}
const GL_BASE_RENDER = render;
render=function(){setLanguageShell();GL_BASE_RENDER();translateTextNodesItalian();};

Object.assign(GL_TEXT_IT, GL_IT_MORE);
function italianizePhrase(txt){
  if(!isItalian() || !txt) return txt;
  let out=txt;
  const keys=Object.keys(GL_TEXT_IT).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    const v=GL_TEXT_IT[k];
    // exact first
    if(out.trim()===k) return out.replace(k,v);
    // safe phrase replacement for common UI text
    const escaped=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(`\\b${escaped}\\b`,'g'),v);
  }
  // small generic replacements
  out=out.replace(/(\d+) tower\(s\)/g,'$1 torre').replace(/(\d+) towers/g,'$1 torri').replace(/(\d+) tower/g,'$1 torre').replace(/active tower/g,'torre attiva').replace(/active towers/g,'torri attive').replace(/days/g,'giorni').replace(/slots/g,'slot').replace(/selected tower/gi,'torre selezionata');
  return out;
}
function translateEverythingItalian(){
  if(!isItalian()) return;
  try{
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(node){
      if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p=node.parentElement;
      if(!p || ['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
      // Do not translate option text without explicit values; it can change select values.
      if(p.tagName==='OPTION' && !p.hasAttribute('value')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{n.nodeValue=italianizePhrase(n.nodeValue);});
    document.querySelectorAll('[placeholder]').forEach(el=>el.setAttribute('placeholder',italianizePhrase(el.getAttribute('placeholder'))));
    document.querySelectorAll('[title]').forEach(el=>el.setAttribute('title',italianizePhrase(el.getAttribute('title'))));
  }catch(e){}
}
// Wrap the current render again so the enhanced full-page Italian pass runs last.
const GL_PREVIOUS_RENDER_WITH_IT = render;
render=function(){GL_PREVIOUS_RENDER_WITH_IT();translateEverythingItalian();};
render();
